# UCE nightly：统一证据门禁 + sanitizer 放大
name: UCE Nightly

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/**'
      - '.gitignore'
  schedule:
    - cron: '20 17 * * *'
  workflow_dispatch:

env:
  BUILD_TYPE: RelWithDebInfo
  UCE_RUN_ID: nightly-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  uce_nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            zlib1g-dev \
            python3 \
            python3-pip \
            apache2 \
            apache2-dev \
            libapache2-mod-http2 \
            libevent-dev \
            strace \
            libnghttp3-dev

          # 默认层级不强制 HTTP/3；运行镜像提供兼容软件包时安装其依赖。
          sudo apt-get install -y libngtcp2-dev || true

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tests/libcurl_consistency/requirements.lock.txt

      - name: Ensure curl testenv tool paths (httpd/apxs)
        run: |
          set -euo pipefail
          if [ ! -x /usr/bin/httpd ] && command -v apache2 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v apache2)" /usr/bin/httpd
          fi
          if [ ! -x /usr/bin/apxs ] && command -v apxs2 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v apxs2)" /usr/bin/apxs
          fi

      - name: Configure nightly build
        run: |
          set -euo pipefail
          cmake -S . -B build-nightly \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DQCURL_BUILD_LIBCURL_CONSISTENCY=ON

      - name: Libcurl consistency infrastructure gate
        run: |
          set -euo pipefail
          ctest --test-dir build-nightly -R '^qcurl_libcurl_consistency_infrastructure$' --output-on-failure

      - name: Build nightly targets
        run: |
          set -euo pipefail
          cmake --build build-nightly --parallel

      - name: Run UCE nightly tier
        run: |
          set -euo pipefail
          python3 scripts/run_uce_gate.py --tier nightly --build-dir build-nightly --run-id "${{ env.UCE_RUN_ID }}"

      - name: Run ASan/UBSan/LSan bundle
        run: |
          set -euo pipefail
          python3 scripts/run_uce_sanitizers.py \
            --profile asan-ubsan-lsan \
            --build-dir build-asan \
            --output-dir build/evidence/uce-sanitizers/asan \
            --run-id "${{ env.UCE_RUN_ID }}"

      - name: Prepare matching instrumented Qt for TSan
        run: |
          set -euo pipefail
          ROOT="$PWD"
          QT_VERSION="$(qmake6 -query QT_VERSION)"
          QT_SERIES="${QT_VERSION%.*}"
          DEPS="$ROOT/build/tsan-deps"
          QT_TSAN_PREFIX="$DEPS/qt-$QT_VERSION"
          SOURCE="$DEPS/src/qtbase-$QT_VERSION"
          EVIDENCE="$ROOT/build/evidence/uce-sanitizers/tsan/$UCE_RUN_ID/qt-dependency"
          ARCHIVE="qtbase-everywhere-src-$QT_VERSION.tar.xz"
          URL="https://download.qt.io/archive/qt/$QT_SERIES/$QT_VERSION/submodules/$ARCHIVE"
          mkdir -p "$SOURCE" "$DEPS/qtbase-build" "$EVIDENCE"
          printf 'source=%s\nQt=%s\n' "$URL" "$QT_VERSION" > "$EVIDENCE/source.txt"
          (
            cd "$DEPS/src"
            curl -fL "$URL" -o "$ARCHIVE"
            curl -fL "$URL.sha256" -o "$ARCHIVE.sha256"
            sha256sum --check "$ARCHIVE.sha256" | tee "$EVIDENCE/checksum.log"
            cp "$ARCHIVE.sha256" "$EVIDENCE/"
            tar -xf "$ARCHIVE" --strip-components=1 -C "$SOURCE"
          )
          (
            cd "$DEPS/qtbase-build"
            "$SOURCE/configure" -prefix "$QT_TSAN_PREFIX" -release -force-debug-info \
              -nomake examples -nomake tests -no-gui -no-widgets -sanitize thread \
              -- -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_INSTALL_LIBDIR=lib
          ) 2>&1 | tee "$EVIDENCE/configure.log"
          cmake --build "$DEPS/qtbase-build" --parallel 4 2>&1 | tee "$EVIDENCE/build.log"
          cmake --install "$DEPS/qtbase-build" 2>&1 | tee "$EVIDENCE/install.log"
          cmake -S "." -B "build-tsan" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang \
            -DCMAKE_PREFIX_PATH="$QT_TSAN_PREFIX" -DQt6_DIR="$QT_TSAN_PREFIX/lib/cmake/Qt6" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DQCURL_BUILD_SHARED_LIBS=ON \
            -DQCURL_BUILD_LIBCURL_CONSISTENCY=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

      - name: Run TSAN subset
        run: |
          set -euo pipefail
          HTTPBIN_NAME="qcurl-tsan-$UCE_RUN_ID"
          bash "tests/qcurl/httpbin/start_httpbin.sh" --port 0 --name "$HTTPBIN_NAME" \
            --write-env "build/test-env/tsan-httpbin.env"
          trap 'bash "tests/qcurl/httpbin/stop_httpbin.sh" --name "$HTTPBIN_NAME"' EXIT
          source "build/test-env/tsan-httpbin.env"
          python3 scripts/run_uce_sanitizers.py \
            --profile tsan \
            --build-dir build-tsan \
            --output-dir "build/evidence/uce-sanitizers/tsan/$UCE_RUN_ID" \
            --run-id "${{ env.UCE_RUN_ID }}"

      - name: 校验 UCE nightly 必需归档
        if: always()
        run: |
          set -euo pipefail
          python3 "scripts/verify_uce_archive.py" \
            --evidence-root "build-nightly/evidence/uce" \
            --run-id "${{ env.UCE_RUN_ID }}" \
            --require-pass

      - name: Upload UCE nightly evidence [required]
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uce-nightly-${{ env.UCE_RUN_ID }}
          path: |
            build-nightly/evidence/uce/${{ env.UCE_RUN_ID }}/manifest.json
            build-nightly/evidence/uce/${{ env.UCE_RUN_ID }}/policy_violations.json
            build-nightly/evidence/uce/${{ env.UCE_RUN_ID }}.tar.gz
            build-nightly/evidence/uce/${{ env.UCE_RUN_ID }}.archive-envelope.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload sanitizer evidence [required]
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uce-sanitizers-${{ env.UCE_RUN_ID }}
          path: |
            build/evidence/uce-sanitizers/asan/
            build/evidence/uce-sanitizers/tsan/
          retention-days: 14
          if-no-files-found: error

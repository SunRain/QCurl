evidence_types:
  contract: Required observable equality or failure semantics.
  regression: Historical edge case guard.
  smoke: Coarse health check that must not be described as a strong contract.
  diagnostic: Optional detail for investigation.

contracts:
  download_upload_p0:
    evidence_type: contract
    suite: p0
    cases:
      - id: download_range_resume
        nodeid: tests/libcurl_consistency/test_p0_consistency.py::test_p0_consistency[download_range_resume]
        pytest: tests/libcurl_consistency/test_p0_consistency.py
        artifact_cases:
          p0_download/lc_range_resume_http_1.1: [request, response, response.body_len, response.body_sha256]
          p0_download/lc_range_resume_h2: [request, response, response.body_len, response.body_sha256]
